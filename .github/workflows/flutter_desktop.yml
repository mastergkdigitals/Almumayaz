name: Flutter desktop checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop_flutter/**'
      - '.github/workflows/flutter_desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop_flutter/**'
      - '.github/workflows/flutter_desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop_flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget and unit tests
        run: flutter test

      - name: Run backend-free application workflow smoke test
        run: flutter test integration_test/release_profile_smoke_test.dart

      - name: Verify customer profile cannot expose Design System
        run: >-
          flutter test test/customer_build_profile_test.dart
          --dart-define=APP_EDITION=customer
          --dart-define=SHOW_DESIGN_SYSTEM=true

  build-windows-editions:
    runs-on: windows-latest
    needs: analyze-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: internal
            configuration: config/internal.json
          - edition: customer-example
            configuration: config/customer.example.json
    defaults:
      run:
        working-directory: apps/desktop_flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify edition profile
        shell: pwsh
        run: >-
          flutter test test/customer_build_profile_test.dart
          --dart-define-from-file=${{ matrix.configuration }}

      - name: Build Windows edition
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define-from-file=${{ matrix.configuration }}

      - name: Package Windows edition
        shell: pwsh
        run: >-
          Compress-Archive
          -Path build/windows/x64/runner/Release/*
          -DestinationPath build/Almumayaz-${{ matrix.edition }}-windows.zip

      - name: Upload Windows edition
        uses: actions/upload-artifact@v4
        with:
          name: Almumayaz-${{ matrix.edition }}-windows
          path: apps/desktop_flutter/build/Almumayaz-${{ matrix.edition }}-windows.zip
          if-no-files-found: error
